name: Drift Detection

# Nightly refresh-only plan against organization/ and platform/, independent
# of whether either directory auto-applies. Apply automation only changes
# how INTENDED changes land — it says nothing about changes that happen
# outside Terraform entirely (a console edit during an incident, another
# tool touching a managed resource, a manual apply that only half-completed
# or ran from an uncommitted checkout). This matters most for organization/,
# which never auto-applies at all — nothing else ever notices if it drifts —
# but platform/ is checked too, since its auto-apply only fires on a merge
# to main that touches platform/ paths; a change made any other way would
# otherwise sit unnoticed indefinitely.
#
# A red run here relies on GitHub's built-in "scheduled workflow failed"
# email notification rather than custom alerting — same mechanism
# Terraform-Platform's own drift-detection.yaml uses. workflow_dispatch is
# there so a run can be triggered on demand instead of waiting for the
# schedule.

on:
  schedule:
    - cron: '0 3 * * *' # nightly, offset from Terraform-Platform's 02:00 run
  workflow_dispatch:

concurrency:
  group: drift-detection
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Terraform CLI version: single source in .terraform-version at the repo
  # root, read with `cat` in the step below — same as terraform.yaml and
  # Terraform-platform.
  # organization/variables.tf requires this (no default) — refresh-only plan
  # needs it too, same as terraform.yaml's validate/plan jobs, even though
  # this is read-only and never touches the value's actual contents.
  TF_VAR_account_emails: ${{ secrets.ACCOUNT_EMAILS_JSON }}
  # platform/security-alerts.tf's alert_email has no default either — same
  # reasoning, needed for platform/'s refresh-only plan to run at all.
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  drift-check:
    name: Drift Check (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [organization, platform]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Terraform version
        id: tfver
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT_ID }}:role/TerraformPlan
          aws-region: eu-west-2
          role-session-name: gha-drift-${{ matrix.dir }}

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      # -refresh-only isolates "has AWS diverged from what Terraform's state
      # thinks is true" from "there's a pending code change not yet applied"
      # — an ordinary `terraform plan` conflates both, which would make this
      # job cry wolf on every routine unmerged PR.
      #
      # Drift is decided from resource_drift[] in the plan's own JSON, NOT
      # from -detailed-exitcode alone. That flag has a documented history of
      # returning the wrong code with -refresh-only — 0 when there IS drift
      # (hashicorp/terraform#35117) and 2 when there ISN'T (#36403). The exit
      # code is still used to catch "terraform itself errored", and a
      # ::warning:: fires if it disagrees with the JSON. Kept in sync with
      # Terraform-platform's drift-detection.yaml, which does the same.
      - name: Terraform Plan (refresh-only drift check)
        id: drift
        run: |
          set +e
          terraform plan -refresh-only -no-color -input=false -detailed-exitcode -out=drift.tfplan
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 1 ]; then
            echo "::error::Drift check failed for ${{ matrix.dir }} — terraform plan itself errored (auth, network, etc.), not drift. See the error above."
            exit 1
          fi

          terraform show -json drift.tfplan > drift.json
          drift_count=$(jq '(.resource_drift // []) | length' drift.json)
          echo "drift_count=$drift_count" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 2 ] && [ "$drift_count" -eq 0 ]; then
            echo "::warning::${{ matrix.dir }}: -detailed-exitcode returned 2 but resource_drift is empty (known flaky flag — hashicorp/terraform#36403). Treating as NO drift."
          fi
          if [ "$exit_code" -eq 0 ] && [ "$drift_count" -gt 0 ]; then
            echo "::warning::${{ matrix.dir }}: -detailed-exitcode returned 0 but resource_drift has $drift_count entr(y/ies) (known flaky flag — hashicorp/terraform#35117). Treating as DRIFT."
          fi

          if [ "$drift_count" -gt 0 ]; then
            echo "::warning::Drift detected in ${{ matrix.dir }} ($drift_count resource(s)) — AWS no longer matches Terraform's state."
            jq -r '(.resource_drift // [])[].address' drift.json | sed 's/^/  - /'
            {
              echo "### Drift: \`${{ matrix.dir }}\` ($drift_count resource(s))"
              echo '```'
              jq -r '(.resource_drift // [])[].address' drift.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No drift detected in ${{ matrix.dir }}"
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-report-${{ matrix.dir }}
          path: ${{ matrix.dir }}/drift.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fail job on drift
        if: steps.drift.outputs.has_drift == 'true'
        run: exit 1
