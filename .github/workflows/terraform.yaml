name: Terraform - Management Account

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tf"
      - "**.tfvars"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**.tf"
  workflow_dispatch:

env:
  TF_VAR_account_emails: ${{ secrets.ACCOUNT_EMAILS_JSON }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [organization, platform]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify account_emails is populated
        if: matrix.dir == 'organization'
        run: |
          if [ -z "$TF_VAR_account_emails" ]; then
            echo "TF_VAR_account_emails is empty. Check ACCOUNT_EMAILS_JSON exists in the Secrets tab (not Variables)."
            exit 1
          fi
          echo "$TF_VAR_account_emails" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d)} keys: {sorted(d.keys())}')"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan:
    name: Plan (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        dir: [organization, platform]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::145678291484:role/TerraformPlan
          aws-region: eu-west-2
          role-session-name: gha-plan-${{ matrix.dir }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        # aws_iam_role_policy.terraform_plan_lock_access (platform/) applied
        # and confirmed 2026-08-17 — TerraformPlan can now Put/Delete the
        # .tflock objects for both org/ and platform/ keys, so normal
        # locking (no -lock=false) is safe again.
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Update PR Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          DIR: ${{ matrix.dir }}
        with:
          script: |
            let plan = process.env.PLAN || '(no output captured)';
            const dir = process.env.DIR;

            // GitHub rejects comment bodies over 65,536 chars. Without this
            // the API call fails and the comment never posts at all.
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated, see workflow logs)';
            }

            // Hidden marker rather than matching on the heading text: the
            // plan output itself can contain the heading string. Marker is
            // per-directory so the organization/ and platform/ matrix legs
            // each own their own comment instead of racing to update one.
            const marker = `<!-- terraform-plan-${dir} -->`;
            const output = `${marker}\n#### Terraform Plan 📝 (\`${dir}\`)\n\n<details><summary>Show Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Apply (platform)
    runs-on: ubuntu-latest
    # organization/ + platform/ split complete 2026-08-17: removed.tf and
    # import.tf deleted, both directories plan clean, TerraformPlan's lock
    # permission live. Re-enabled.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform-validate
    concurrency:
      group: tf-apply-platform
      cancel-in-progress: false
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::145678291484:role/TerraformDeploy
          aws-region: eu-west-2
          role-session-name: gha-apply-platform

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=120s
