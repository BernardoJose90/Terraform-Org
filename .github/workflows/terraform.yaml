name: Terraform - Management Account

on:
  pull_request:
    branches: [main]
    paths:
      - "*.tf"
      - "**.tf"
  push:
    branches: [main]
    paths:
      - "*.tf"
      - "**.tf"
  workflow_dispatch:

env:
  TF_VAR_account_emails: ${{ secrets.ACCOUNT_EMAILS_JSON }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "AWS Organizations"
    steps:

      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0


      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: "AWS Organizations"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145678291484:role/TerraformPlan
          aws-region: eu-west-2
          role-session-name: gha-plan-management

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Update PR Comment
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            let plan = process.env.PLAN || '(no output captured)';

            // GitHub rejects comment bodies over 65,536 chars. Without this
            // the API call fails and the comment never posts at all.
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated, see workflow logs)';
            }

            // Hidden marker rather than matching on the heading text: the
            // plan output itself can contain the heading string.
            const marker = '<!-- terraform-plan-management -->';
            const output = `${marker}\n#### Terraform Plan 📝\n\n<details><summary>Show Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    # terraform-plan only runs on pull_request and this job only runs on
    # push — those triggers never coincide, so needs: terraform-plan would
    # skip-cascade this job on every single push (which is exactly what was
    # happening: Apply has never actually run). terraform-validate has no
    # trigger restriction, so it's the one job guaranteed to run alongside
    # this one and still gate on validation passing.
    #
    # EXPECTED TO FAIL, on purpose: TerraformDeploy has no organizations:*
    # permissions and never should — per AWS's own guidance, the management
    # account's automation is deliberately kept least-privilege rather than
    # widened to cover AWS Organizations administration (account creation,
    # OUs, SCPs). Those changes (organizations.tf, scp.tf) are applied
    # manually via an admin AWS profile. This job still runs so it correctly
    # applies everything TerraformDeploy *does* have permissions for (IAM,
    # SSM, the state bucket policy, etc.) — the red X on organizations.tf/
    # scp.tf changes is accurate, not a bug. See README's Security Notes.
    needs: terraform-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # environment: "management-account"
    concurrency:
      group: tf-apply-management
      cancel-in-progress: false
    defaults:
      run:
        working-directory: "AWS Organizations"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145678291484:role/TerraformDeploy
          aws-region: eu-west-2
          role-session-name: gha-apply-management

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=120s
